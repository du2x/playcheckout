name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Reads the pnpm version from the packageManager field (pnpm@11.24.0);
        # a differing `version:` input hard-errors the action.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Gate 1 — types + lint
        run: |
          pnpm typecheck
          pnpm lint

      - name: Gate 2 — sim bot scenarios
        run: pnpm test:sim

      - name: Gate 3 — client harness (headless Chromium)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:client
