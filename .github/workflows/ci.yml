name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    # Activates once Phase 1 (pnpm workspace) exists; inert before that.
    if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Gate 1 — types + lint
        run: |
          pnpm typecheck
          pnpm lint

      - name: Gate 2 — sim bot scenarios
        run: pnpm test:sim

      - name: Gate 3 — client harness (headless Chromium)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:client
